<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!-- manifest.json содержит название и значки приложения для добавления сайта на устройство. -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- %PUBLIC_URL% заменяется при сборке на адрес публичных ресурсов.
      Здесь указываются файлы из папки public; изображения из src подключаются через import в компонентах. -->
    <title>Археологическая карта Петербурга</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- Это HTML-шаблон: React заполняет элемент root из src/index.js.
      Скрипты добавляет сборщик. Для разработки используйте npm start, для сборки — npm run build.
      Название вкладки меняется в title выше, краткое описание для поисковиков — в meta description. -->
  </body>
</html>
