# Настройки запуска приложения в Docker. Команда docker compose up --build собирает и запускает сервис.
version: "3.7"

services:
  # Имя сервиса внутри Compose; здесь описан только frontend, сервер API запускается отдельно.
  archeomap_app:
    build:
      # Dockerfile и исходники берутся из текущей папки.
      context: ./
    ports: 
      # Слева порт компьютера, справа порт контейнера: сайт доступен на localhost:3000.
      - "3000:3000"
